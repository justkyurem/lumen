<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="base.css">
<style>
  html, body { overflow: hidden; }
  body { padding: 0 10px 20px; }
  #cc { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--field); border-radius: 13px; padding: 10px; box-shadow: inset 0 0 0 .5px var(--line); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .tog { display: flex; align-items: center; gap: 10px; padding: 4px 2px; }
  .tog + .tog { margin-top: 6px; }
  .circle { width: 32px; height: 32px; border-radius: 50%; background: var(--hover); display: flex; align-items: center; justify-content: center; flex: none; transition: background .15s; }
  .circle .ico { width: 17px; height: 17px; }
  .on .circle { background: var(--accent); color: #fff; }
  .tog .l { min-width: 0; }
  .tog b { display: block; font-size: 12.5px; font-weight: 600; }
  .tog small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
  .card.mini { display: flex; align-items: center; gap: 10px; padding: 10px; }
  .card.mini b { font-size: 12px; font-weight: 600; line-height: 1.2; }
  .sl-title { font-size: 12px; font-weight: 600; margin: 0 0 8px 2px; }
  .slider { display: flex; align-items: center; gap: 8px; }
  .slider .ico { width: 16px; height: 16px; color: var(--muted); }
  .slider button { all: unset; display: flex; }
  input[type=range] { -webkit-appearance: none; flex: 1; height: 24px; border-radius: 12px; background: linear-gradient(90deg, var(--fill, #fff) var(--p, 50%), var(--hover) var(--p, 50%)); box-shadow: inset 0 0 0 .5px var(--line); }
  [data-dark="true"] input[type=range] { --fill: #e9e9ee; }
  input[type=range] { --fill: #fff; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .media { display: flex; align-items: center; gap: 10px; }
  .media .art { width: 40px; height: 40px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 40%, #000)); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
  .media .art .ico { width: 20px; height: 20px; }
  .media .info { flex: 1; min-width: 0; }
  .media .info b, .media .info small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media .info b { font-size: 12.5px; }
  .media .info small { font-size: 11px; color: var(--muted); }
  .media .ctl { display: flex; gap: 2px; }
  .media .ctl button { all: unset; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .media .ctl button:hover { background: var(--hover); }
  .media .ctl .ico { width: 15px; height: 15px; }
  .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sq { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 6px; text-align: center; }
  .sq .ico { width: 20px; height: 20px; }
  .sq span { font-size: 10.5px; line-height: 1.15; color: var(--muted); }
  .sq.on { background: var(--accent); color: #fff; }
  .sq.on span { color: rgba(255,255,255,.85); }
  .card:active, .tog:active .circle { filter: brightness(.92); }
  .profiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .profiles button { all: unset; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 7px 2px; border-radius: 9px; font-size: 10.5px; color: var(--muted); text-align: center; }
  .profiles button .ico { width: 18px; height: 18px; color: var(--text); }
  .profiles button:hover { background: var(--hover); }
  .profiles button.on { background: var(--accent); color: #fff; }
  .profiles button.on .ico { color: #fff; }
  .obs-state { font-weight: 600; font-size: 11px; color: var(--muted); }
  .obs-state.live { color: #ff453a; }
  .obs-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .obs-btns button { all: unset; text-align: center; padding: 8px; border-radius: 9px; background: var(--hover); font-size: 12px; font-weight: 600; }
  .obs-btns button.on { background: #ff453a; color: #fff; }
  .scenes { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .scenes button { all: unset; padding: 4px 9px; border-radius: 7px; background: var(--hover); font-size: 11.5px; }
  .scenes button.on { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div class="panel pop" id="panel"><div id="cc">
  <div class="grid2">
    <div class="card" id="radios">
      <div class="tog" id="wifi"><span class="circle"></span><span class="l"><b>Wi-Fi</b><small></small></span></div>
      <div class="tog" id="bt"><span class="circle"></span><span class="l"><b>Bluetooth</b><small></small></span></div>
      <div class="tog" id="dnd2"><span class="circle"></span><span class="l"><b data-i18n="cc.dnd"></b><small></small></span></div>
    </div>
    <div class="col">
      <div class="card mini tog" id="dark"><span class="circle"></span><b data-i18n="cc.dark"></b></div>
      <div class="card mini tog" id="dnd"><span class="circle"></span><b data-i18n="cc.dnd"></b></div>
    </div>
  </div>

  <div class="card">
    <div class="sl-title" data-i18n="cc.sound"></div>
    <div class="slider"><button id="muteBtn"></button><input type="range" id="vol" min="0" max="100"></div>
  </div>
  <div class="card hidden" id="brightCard">
    <div class="sl-title" data-i18n="cc.display"></div>
    <div class="slider"><span id="brIco"></span><input type="range" id="bright" min="0" max="100"></div>
  </div>

  <div class="card hidden" id="mediaCard">
    <div class="media">
      <div class="art" id="art"></div>
      <div class="info"><b id="mTitle"></b><small id="mArtist"></small></div>
      <div class="ctl"><button data-k="prev" id="bPrev"></button><button data-k="play" id="bPlay"></button><button data-k="next" id="bNext"></button></div>
    </div>
  </div>

  <div class="card hidden" id="obsCard">
    <div class="sl-title" style="display:flex;justify-content:space-between"><span>OBS</span><span class="obs-state" id="obsState"></span></div>
    <div class="obs-btns"><button id="obsStream"></button><button id="obsRec"></button></div>
    <div class="scenes" id="obsScenes"></div>
  </div>

  <div class="card">
    <div class="sl-title" data-i18n="cc.profiles"></div>
    <div class="profiles" id="profiles"></div>
  </div>

  <div class="row4">
    <div class="card sq" id="focus"></div>
    <div class="card sq" data-a="snapshot"></div>
    <div class="card sq" data-a="desktop"></div>
    <div class="card sq" data-a="lock"></div>
  </div>
</div></div>
<script src="icons.js"></script>
<script src="common.js"></script>
<script src="control.js"></script>
</body>
</html>

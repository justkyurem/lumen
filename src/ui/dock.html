<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="base.css">
<style>
  html, body { width: 100%; height: 100%; overflow: hidden; }
  :root { --dock-glass: rgba(246, 246, 248, .62); --dot: rgba(0,0,0,.55); --sep: rgba(0,0,0,.14); --label-bg: rgba(250,250,252,.94); }
  [data-dark="true"] { --dock-glass: rgba(36, 36, 40, .6); --dot: rgba(255,255,255,.75); --sep: rgba(255,255,255,.16); --label-bg: rgba(40,40,44,.94); }

  #wrap { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
  #dock { position: relative; display: flex; align-items: flex-end; gap: 6px; padding: 6px 8px 7px; transition: transform .32s cubic-bezier(.2,.8,.2,1), opacity .25s; }
  #dock::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--s) + 13px); border-radius: 20px;
    background: var(--dock-glass); border: 1px solid var(--stroke);
    box-shadow: 0 0 0 .5px var(--edge), 0 10px 30px rgba(0,0,0,.18);
  }
  #dock.hidden-dock { transform: translateY(calc(100% + 12px)); opacity: 0; }

  .item { position: relative; z-index: 1; width: var(--s); height: var(--s); display: flex; align-items: center; justify-content: center; transition: width .12s ease-out, height .12s ease-out; }
  .tile { width: 100%; height: 100%; border-radius: 23%; background: var(--tile);
    box-shadow: inset 0 0 0 .5px var(--tile-edge), 0 1px 2px rgba(0,0,0,.12), 0 4px 10px rgba(0,0,0,.08);
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .tile img { width: 62%; height: 62%; object-fit: contain; pointer-events: none; }
  .tile.custom img { width: 100%; height: 100%; object-fit: cover; }
  .tile .ico { width: 56%; height: 56%; color: var(--text); opacity: .82; }
  .tile.folder { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 70%, white), var(--accent)); }
  .tile.folder .ico { color: #fff; opacity: 1; }
  .tile .letter { font-size: calc(var(--s) * .42); font-weight: 600; color: var(--accent); }
  .item:active .tile { filter: brightness(.85); }
  .item.bounce { animation: bounce .7s cubic-bezier(.3,.6,.4,1) 2; }
  @keyframes bounce { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-34%) } }

  .dot { position: absolute; bottom: -5px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--dot); opacity: 0; transition: opacity .2s; }
  .item.running .dot { opacity: 1; }
  .badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ff3b30; color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.3); }

  .label { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%) translateY(4px); padding: 4px 10px; border-radius: 7px; white-space: nowrap;
    background: var(--label-bg); color: var(--text); font-size: 12.5px; box-shadow: 0 0 0 .5px var(--edge), 0 4px 14px rgba(0,0,0,.15); opacity: 0; pointer-events: none; transition: opacity .12s, transform .12s; }
  .item:hover .label { opacity: 1; transform: translateX(-50%) translateY(0); }
  body.popover-open .label { opacity: 0 !important; }

  .sep { position: relative; z-index: 1; width: 1px; height: var(--s); margin: 0 3px 2px; background: var(--sep); }
</style>
</head>
<body>
<div id="wrap"><div id="dock"></div></div>
<script src="icons.js"></script>
<script src="common.js"></script>
<script src="dock.js"></script>
</body>
</html>

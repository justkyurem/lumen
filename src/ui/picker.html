<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="base.css">
<style>
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: crosshair; }
  canvas#shot { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #loupe { position: fixed; width: 132px; pointer-events: none; display: none; }
  #loupe canvas { width: 132px; height: 132px; border-radius: 50%; box-shadow: 0 0 0 3px #fff, 0 0 0 4px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.5); image-rendering: pixelated; display: block; }
  #loupe .lab { margin: 10px auto 0; width: max-content; padding: 4px 10px; border-radius: 7px; background: rgba(20,20,24,.92); color: #fff; font: 600 12.5px "Cascadia Mono", Consolas, monospace; display: flex; gap: 8px; align-items: center; }
  #loupe .sw { width: 12px; height: 12px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255,255,255,.5); }
  .help { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 9px; background: rgba(20,20,24,.88); color: #fff; font-size: 12.5px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="shot"></canvas>
<div id="loupe"><canvas id="zoom" width="11" height="11"></canvas><div class="lab"><span class="sw" id="sw"></span><span id="hex"></span></div></div>
<div class="help" data-i18n="picker.help"></div>
<script src="common.js"></script>
<script src="picker.js"></script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="base.css">
<style>
  html, body { overflow: hidden; }
  body { padding: 16px 20px 28px; }
  .panel { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 58px; flex: none; }
  .bar .ico { width: 22px; height: 22px; color: var(--muted); }
  #q { all: unset; flex: 1; font: 400 21px/1 var(--font-display); color: var(--text); caret-color: var(--accent); }
  #q::placeholder { color: var(--muted); opacity: .7; }
  .kbd { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
  #results { border-top: 1px solid var(--line); padding: 6px; max-height: 360px; overflow-y: auto; }
  #results:empty { display: none; }
  .sec { font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 8px 12px 4px; letter-spacing: .2px; }
  .row { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 9px; }
  .row.sel { background: var(--accent); color: #fff; }
  .row.sel .sub, .row.sel .hint { color: rgba(255,255,255,.8); }
  .row .ic { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex: none; }
  .row .ic img { width: 28px; height: 28px; object-fit: contain; }
  .row .ic .ico { width: 20px; height: 20px; }
  .row .letter { width: 28px; height: 28px; border-radius: 7px; background: var(--field); display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--accent); }
  .row.sel .letter { background: rgba(255,255,255,.2); color: #fff; }
  .row .txt { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
  .row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .row .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .row .hint { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .big { height: 64px; }
  .big .name { font: 600 26px/1 var(--font-display); }
  .foot { display: flex; gap: 16px; justify-content: flex-end; padding: 8px 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
  .foot:empty { display: none; }
</style>
</head>
<body>
<div class="panel pop" id="panel">
  <div class="bar"><span class="ico" id="sico"></span><input id="q" spellcheck="false" autocomplete="off" data-i18n-ph="launcher.placeholder"><span class="kbd">Esc</span></div>
  <div id="results"></div>
  <div class="foot" id="foot"></div>
</div>
<script src="icons.js"></script>
<script src="common.js"></script>
<script src="calc.js"></script>
<script src="launcher.js"></script>
</body>
</html>

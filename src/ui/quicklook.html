<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; media-src file:; frame-src file:; object-src file:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="base.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { padding: 10px 16px 24px; }
  .panel { height: 100%; display: grid; grid-template-rows: 48px 1fr; }
  .top { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; border-bottom: 1px solid var(--line); }
  .top img { width: 20px; height: 20px; }
  .top .name { font-weight: 650; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .top button { all: unset; padding: 5px 11px; border-radius: 7px; background: var(--field); font-size: 12px; white-space: nowrap; }
  .top button:hover { background: var(--hover); }
  .top button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  .top .nav { font-size: 12px; color: var(--muted); }
  #view { min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: color-mix(in srgb, var(--field) 60%, transparent); }
  #view img.full, #view video { max-width: 100%; max-height: 100%; object-fit: contain; }
  #view iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  #view pre { align-self: stretch; width: 100%; overflow: auto; padding: 16px 20px; font: 12.5px/1.55 "Cascadia Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-word; user-select: text; }
  .other { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); }
  .other img { width: 96px; height: 96px; }
  .other b { color: var(--text); font-size: 16px; }
  .folder { align-self: stretch; width: 100%; overflow: auto; padding: 14px 20px; columns: 3; font-size: 13px; }
  .folder div { padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  audio { width: 70%; }
</style>
</head>
<body>
<div class="panel pop" id="panel">
  <div class="top"><img id="ico"><span class="name" id="name"></span><span class="nav" id="nav"></span><span class="meta" id="meta"></span>
    <button id="reveal" data-i18n="ql.reveal"></button><button class="primary" id="open" data-i18n="ql.open"></button></div>
  <div id="view"></div>
</div>
<script src="icons.js"></script>
<script src="common.js"></script>
<script src="quicklook.js"></script>
</body>
</html>

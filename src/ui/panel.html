<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="base.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { padding: 0 6px 6px 0; }
  .panel { height: 100%; display: flex; flex-direction: column; animation: slide .22s cubic-bezier(.2,.8,.2,1); }
  @keyframes slide { from { transform: translateX(24px); opacity: 0; } }
  .scroll { flex: 1; overflow-y: auto; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
  .head { padding: 4px 4px 6px; }
  .head .day { font: 600 13px var(--font); color: var(--accent); text-transform: capitalize; }
  .head .date { font: 650 26px/1.15 var(--font-display); text-transform: capitalize; }
  .card { background: var(--field); border-radius: 14px; padding: 12px 14px; box-shadow: inset 0 0 0 .5px var(--line); }
  .card h4 { font-size: 11.5px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .btn { all: unset; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 9px; background: var(--hover); font-size: 13px; }
  .btn:hover { filter: brightness(1.15); }
  .btn .ico { width: 16px; height: 16px; color: var(--accent); }
  .muted { color: var(--muted); font-size: 12px; }
  .month { display: flex; justify-content: space-between; align-items: center; font-weight: 650; font-size: 13.5px; margin-bottom: 6px; text-transform: capitalize; }
  .month button { all: unset; width: 22px; height: 22px; text-align: center; border-radius: 6px; color: var(--muted); }
  .month button:hover { background: var(--hover); color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 12px; }
  .dn { color: var(--muted); font-size: 10.5px; font-weight: 600; padding-bottom: 3px; }
  .d { height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; position: relative; font-variant-numeric: tabular-nums; }
  .d:hover { background: var(--hover); }
  .d.out { opacity: .35; }
  .d.today { background: var(--accent); color: #fff; font-weight: 650; }
  .d.sel:not(.today) { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .d.ev::after { content: ""; position: absolute; bottom: 2px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .d.today.ev::after { background: #fff; }
  .ev-item { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
  .ev-item i { width: 3px; height: 16px; border-radius: 2px; background: var(--accent); flex: none; }
  .ev-item span { flex: 1; }
  .ev-item button { all: unset; color: var(--muted); opacity: 0; }
  .ev-item:hover button { opacity: 1; }
  input.add { all: unset; width: 100%; box-sizing: border-box; font-size: 13px; padding: 7px 10px; margin-top: 6px; border-radius: 8px; background: var(--hover); }
  .wx { display: flex; align-items: center; gap: 12px; }
  .wx .t { font: 300 34px/1 var(--font-display); }
  .media { display: flex; align-items: center; gap: 10px; }
  .media .art { width: 42px; height: 42px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 40%, #000)); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
  .media .art .ico { width: 20px; height: 20px; }
  .media .info { flex: 1; min-width: 0; }
  .media .info b, .media .info small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media .info small { color: var(--muted); font-size: 11.5px; }
  .media .ctl { display: flex; }
  .media .ctl button { all: unset; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .media .ctl button:hover { background: var(--hover); }
  .media .ctl .ico { width: 15px; height: 15px; }
</style>
</head>
<body>
<div class="panel" id="panel"><div class="scroll">
  <div class="head"><div class="day" id="day"></div><div class="date" id="date"></div></div>
  <div class="card">
    <h4 data-i18n="pn.notifications"></h4>
    <div class="btn" id="winNotif"><span class="ico" id="bellIco"></span><span data-i18n="pn.openWin"></span></div>
    <div class="muted" style="margin-top:8px" data-i18n="pn.notifHint"></div>
  </div>
  <div class="card hidden" id="mediaCard"><h4 data-i18n="pn.music"></h4><div class="media">
    <div class="art" id="art"></div><div class="info"><b id="mTitle"></b><small id="mArtist"></small></div>
    <div class="ctl"><button data-k="prev" id="bPrev"></button><button data-k="play" id="bPlay"></button><button data-k="next" id="bNext"></button></div>
  </div></div>
  <div class="card" id="cal"></div>
  <div class="card hidden" id="wx"></div>
</div></div>
<script src="icons.js"></script>
<script src="common.js"></script>
<script src="panel.js"></script>
</body>
</html>
